name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent signing key
        id: restore-key
        uses: actions/cache@v4
        with:
          path: app/dimlife-debug.keystore
          key: dimlife-radio-signing-key-v1
      - name: Generate signing key on first build
        if: steps.restore-key.outputs.cache-hit != 'true'
        run: keytool -genkeypair -v -keystore app/dimlife-debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=DimLife,C=US"
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DimLife-Radio-v0.1.8.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DimLife-Radio-v0.1.8-Release-APK
          path: DimLife-Radio-v0.1.8.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.8
          name: DimLife Радио v0.1.8
          body: Добавлено фоновое воспроизведение через MediaSessionService, два виджета Android и фирменные графические иконки сайта, VK и Telegram. Подписанный Release APK.
          prerelease: false
          make_latest: true
          files: DimLife-Radio-v0.1.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
